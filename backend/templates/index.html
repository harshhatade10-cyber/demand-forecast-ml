<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<title>Ride AI Dashboard</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script src="https://cdn.tailwindcss.com"></script>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>

/* ===== BACKGROUND ===== */
body {
  background: #020617;
  color: white;
}

body::before {
  content: "";
  position: fixed;
  width: 100%;
  height: 100%;
  background: radial-gradient(circle at 20% 20%, rgba(168,85,247,0.08), transparent 40%);
  z-index: -1;
}

/* ===== GLASS ===== */
.glass {
  background: rgba(255, 255, 255, 0.03);
  border: 1px solid rgba(168,85,247,0.15);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border-radius: 16px;
  transition: all 0.3s ease;
}

.glass:hover {
  transform: translateY(-2px) scale(1.01);
  box-shadow: 0 0 30px rgba(168,85,247,0.2);
}

.active {
  border: 1px solid rgba(168,85,247,0.6);
  box-shadow: 0 0 20px rgba(168,85,247,0.4);
}

</style>

</head>

<body class="flex">

<!-- Sidebar -->

<div class="w-64 bg-black/80 p-6 space-y-6 border-r border-purple-900">
<h1 class="text-2xl font-bold text-purple-300">🚕 Ride AI</h1>

<button onclick="show('dashboard')" class="block hover:text-purple-300">Dashboard</button> <button onclick="show('prediction')" class="block hover:text-purple-300">Prediction</button> <button onclick="show('analytics')" class="block hover:text-purple-300">Analytics</button>

</div>

<!-- Main -->

<div class="flex-1 p-8">

<!-- DASHBOARD -->

<div id="dashboard">
<h1 class="text-3xl font-bold mb-6 text-purple-300">🚀 Smart Demand Overview</h1>

<div class="grid grid-cols-3 gap-6 mb-6">
<div class="glass p-6 text-center">
<p>Active Cities</p>
<h2 class="text-2xl text-purple-300">4+</h2>
</div>

<div class="glass p-6 text-center">
<p>Peak Hour</p>
<h2 class="text-2xl text-purple-300">18:00</h2>
</div>

<div class="glass p-6 text-center">
<p>Status</p>
<h2 class="text-2xl text-purple-300">Live</h2>
</div>
</div>

<div class="h-64 glass p-4">
<canvas id="dashChart"></canvas>
</div>

</div>

<!-- PREDICTION -->

<div id="prediction" class="hidden">

<h1 class="text-2xl mb-4">Select City</h1>
<div id="cities" class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-6"></div>

<h1 class="text-2xl mb-4">Select Area</h1>
<div id="areas" class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-6 hidden"></div>

<div id="result" class="hidden mt-8 p-8 glass text-center border border-purple-400">
<h2 id="value" class="text-6xl text-purple-300 font-bold"></h2>
<p id="level"></p>

<div class="mt-4 h-64">
<canvas id="chartCanvas"></canvas>
</div>

</div>

</div>

<!-- ANALYTICS -->

<div id="analytics" class="hidden">

<!-- Pie -->

<div class="flex justify-center">
<div class="glass p-4 w-96 text-center">
<h2 class="mb-2">City Share</h2>
<canvas id="pie"></canvas>
</div>
</div>

<!-- Bottom -->

<div class="grid grid-cols-2 gap-6 mt-6">

<div class="glass p-4">
<h2>Demand Comparison</h2>
<canvas id="bar"></canvas>
</div>

<div class="glass p-4">
<h2>24h Trend</h2>
<canvas id="line"></canvas>
</div>

</div>

</div>

</div>

<script>

function show(sec){
document.getElementById("dashboard").classList.add("hidden");
document.getElementById("prediction").classList.add("hidden");
document.getElementById("analytics").classList.add("hidden");

document.getElementById(sec).classList.remove("hidden");

if(sec==="analytics") loadAnalytics();
}

let map={}, selectedCity="", chart, barChart, lineChart;

fetch("/locations").then(r=>r.json()).then(d=>{
d.locations.forEach(l=>{
const [c,...a]=l.split("_");
if(!map[c]) map[c]=[];
map[c].push(a.join("_"));
});
createCities();
});

function createCities(){
const el=document.getElementById("cities");
el.innerHTML="";
Object.keys(map).forEach(c=>{
let d=document.createElement("div");
d.className="glass p-4 text-center cursor-pointer";
d.innerText=c;
d.onclick=()=>selectCity(c,d);
el.appendChild(d);
});
}

function selectCity(c,el){
selectedCity=c;

document.querySelectorAll("#cities div").forEach(x=>x.classList.remove("active"));
el.classList.add("active");

document.getElementById("areas").classList.remove("hidden");

const areas=document.getElementById("areas");
areas.innerHTML="";

map[c].forEach(a=>{
let d=document.createElement("div");
d.className="glass p-3 text-center cursor-pointer";
d.innerText=a;
d.onclick=()=>predict(c,a);
areas.appendChild(d);
});
}

function predict(city,area){
fetch("/predict",{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify({city,area})
})
.then(r=>r.json())
.then(d=>{
document.getElementById("result").classList.remove("hidden");

animate(d.predicted_demand);

if(d.predicted_demand>70) level.innerText="🔥 High";
else if(d.predicted_demand>40) level.innerText="⚖ Medium";
else level.innerText="📉 Low";

if(chart) chart.destroy();

chart=new Chart(chartCanvas,{
type:"line",
data:{
labels:[...Array(24).keys()],
datasets:[{
label:"Demand",
data:Array.from({length:24},()=>Math.random()*100),
borderColor:"#a855f7",
backgroundColor:"rgba(168,85,247,0.2)"
}]
},
options:{responsive:true, maintainAspectRatio:false}
});
});
}

function animate(val){
let i=0;
const int=setInterval(()=>{
i+=val/20;
if(i>=val){i=val;clearInterval(int);}
value.innerText=Math.floor(i);
},30);
}

function loadAnalytics(){

const pieChart=new Chart(pie,{
type:"pie",
data:{
labels:["Pune","Mumbai","Nagpur","Amravati"],
datasets:[{
data:[40,30,20,10],
backgroundColor:["#a855f7","#6366f1","#ec4899","#8b5cf6"]
}]
}
});

barChart=new Chart(bar,{
type:"bar",
data:{
labels:["Area1","Area2","Area3","Area4"],
datasets:[{
label:"Demand",
data:[80,60,40,50],
backgroundColor:"#a855f7"
}]
},
options:{responsive:true}
});

lineChart=new Chart(line,{
type:"line",
data:{
labels:[...Array(24).keys()],
datasets:[{
label:"Demand",
data:Array.from({length:24},()=>Math.random()*100),
borderColor:"#a855f7"
}]
},
options:{responsive:true}
});

pie.onclick=function(evt){
const points=pieChart.getElementsAtEventForMode(evt,'nearest',{intersect:true},true);

if(points.length){
const index=points[0].index;
const city=pieChart.data.labels[index];
updateCityCharts(city);
}
}
}

function updateCityCharts(city){

const dataMap={
Pune:[80,60,40,50],
Mumbai:[90,70,60,55],
Nagpur:[50,40,30,35],
Amravati:[30,20,25,15]
};

barChart.data.datasets[0].data=dataMap[city];
barChart.update();

lineChart.data.datasets[0].data=
Array.from({length:24},()=>Math.random()*100);
lineChart.update();
}

new Chart(dashChart,{
type:"line",
data:{
labels:[...Array(24).keys()],
datasets:[{
label:"Demand",
data:Array.from({length:24},()=>Math.random()*100),
borderColor:"#a855f7"
}]
},
options:{responsive:true, maintainAspectRatio:false}
});

</script>

</body>
</html>
