<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Ride Demand Forecast</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Small UI animations -->
  <style>
    .fade-in {
      animation: fadeIn 0.35s ease-in-out;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>

<body class="bg-gradient-to-br from-indigo-700 via-purple-700 to-pink-600 min-h-screen flex items-center justify-center px-4">

  <!-- Main Card -->
  <div class="bg-white/95 backdrop-blur rounded-2xl shadow-2xl p-8 w-full max-w-sm fade-in">

    <!-- Header -->
    <div class="text-center mb-6">
      <h1 class="text-2xl font-bold flex items-center justify-center gap-2">
        🚕 Ride Demand Forecast
      </h1>
      <p class="text-xs text-gray-500 mt-1">
        AI-powered area-wise prediction
      </p>
    </div>

    <!-- Area Select -->
    <div class="mb-5">
      <label class="block mb-2 text-sm font-semibold text-gray-700">
        Select Area
      </label>
      <select
        id="areaSelect"
        class="w-full border border-gray-300 rounded-lg px-3 py-2 text-gray-700
               focus:ring-2 focus:ring-indigo-500 focus:outline-none">
      </select>
    </div>

    <!-- Predict Button -->
    <button
      onclick="predictDemand()"
      class="w-full bg-indigo-600 text-white py-2 rounded-lg font-semibold
             hover:bg-indigo-700 active:scale-[0.98] transition">
      Predict Demand
    </button>

    <!-- Loading -->
    <p id="loadingText"
       class="text-center text-sm text-gray-500 mt-3 hidden">
      Predicting demand...
    </p>

    <!-- Result -->
    <div id="result" class="mt-6 text-center hidden fade-in">
      <p class="text-xs uppercase tracking-wide text-gray-500">
        Predicted Demand
      </p>

      <p id="demandValue"
         class="text-3xl font-bold text-indigo-600 mt-1">
      </p>

      <p id="timeValue"
         class="text-xs text-gray-500 mt-2">
      </p>
    </div>

  </div>

<script>
async function loadAreas() {
  try {
    const res = await fetch("/areas");
    const data = await res.json();

    if (data.error) {
      console.error("Error:", data.error);
      return;
    }

    const select = document.getElementById("areaSelect");
    select.innerHTML = "";

    if (data.areas && Array.isArray(data.areas)) {
      data.areas.forEach(area => {
        const opt = document.createElement("option");
        opt.value = area;
        opt.textContent = area;
        select.appendChild(opt);
      });
    }
  } catch (err) {
    console.error("Failed to load areas:", err);
  }
}

async function predictDemand() {
  const area = document.getElementById("areaSelect").value;
  if (!area) {
    alert("Please select an area");
    return;
  }

  const resultDiv = document.getElementById("result");
  const demandValue = document.getElementById("demandValue");
  const timeValue = document.getElementById("timeValue");
  const loadingText = document.getElementById("loadingText");

  resultDiv.classList.add("hidden");
  loadingText.classList.remove("hidden");

  try {
    const res = await fetch("/predict", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({
        area: area,
        base_fare: 100
      })
    });

    const data = await res.json();

    loadingText.classList.add("hidden");
    resultDiv.classList.remove("hidden");

    timeValue.innerText = "";

    if (data.error) {
      demandValue.innerText = "Error";
      demandValue.className = "text-lg font-semibold text-red-600";
      console.error("Prediction error:", data.error);

    } else if (data.predicted_demand !== undefined) {
      demandValue.innerText = data.predicted_demand + " rides";
      demandValue.className = "text-3xl font-bold text-indigo-600";

      if (data.time) {
        timeValue.innerText = "As of: " + data.time;
      }

    } else {
      demandValue.innerText = "No prediction";
      demandValue.className = "text-lg font-semibold text-red-600";
    }

  } catch (err) {
    console.error("Prediction failed:", err);
    loadingText.classList.add("hidden");
    resultDiv.classList.remove("hidden");
    demandValue.innerText = "Server error";
    demandValue.className = "text-lg font-semibold text-red-600";
  }
}

loadAreas();
</script>

</body>
</html>
